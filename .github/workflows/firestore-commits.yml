name: Push commits to Firestore

on:
  push:
    branches:
      - main   # change if you use a different branch

jobs:
  update-firestore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Push commit info to Firestore
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          COMMIT_URL="${{ github.event.head_commit.url }}"
          COMMIT_TIME="${{ github.event.head_commit.timestamp }}"

          ACCESS_TOKEN=$(gcloud auth print-access-token)

          curl -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://firestore.googleapis.com/v1/projects/smart-client-b8b1c/databases/(default)/documents/commits" \
            -d "{
              \"fields\": {
                \"message\": {\"stringValue\": \"$COMMIT_MSG\"},
                \"author\": {\"stringValue\": \"$COMMIT_AUTHOR\"},
                \"url\": {\"stringValue\": \"$COMMIT_URL\"},
                \"timestamp\": {\"timestampValue\": \"$COMMIT_TIME\"}
              }
            }"
