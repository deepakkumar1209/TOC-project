name: Push Commits to Firestore

on:
  push:
    branches:
      - main  # Trigger on main branch commits

jobs:
  update-firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Push commit to Firestore
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          node -e "
          const admin = require('firebase-admin');
          const commits = require('child_process')
            .execSync('git log -1 --pretty=format:\"%H|%an|%s|%cI\"')
            .toString()
            .split('|');
          
          admin.initializeApp({
            credential: admin.credential.cert({
              projectId: process.env.FIREBASE_PROJECT_ID,
              clientEmail: process.env.FIREBASE_CLIENT_EMAIL,
              privateKey: process.env.FIREBASE_PRIVATE_KEY.replace(/\\n/g, '\n'),
            })
          });

          const db = admin.firestore();
          db.collection('commits').doc(commits[0]).set({
            id: commits[0],
            author: commits[1],
            message: commits[2],
            url: 'https://github.com/${{ github.repository }}/commit/' + commits[0],
            timestamp: new Date(commits[3])
          }).then(() => console.log('Commit pushed to Firestore'));
          "
